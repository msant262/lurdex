<!DOCTYPE html>
<html lang="pt-BR" data-page="produtos">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F5EFE6">
<title>Todos os produtos — Lurdex Magazinne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Sora:wght@200;300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header data-nav></header>

<section class="page-head">
  <div class="container">
    <nav class="crumbs"><a href="index.html">Início</a> · <span>Todos os produtos</span></nav>
    <div class="eyebrow" data-count></div>
    <h1>Todos os <em>produtos.</em></h1>
    <p class="lead">A coleção completa da Lurdex Magazinne. Use os filtros abaixo para navegar por universo ou destacar novidades, edições limitadas e mais vendidos.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="filters" data-cat-filters>
      <button class="filter-chip active" data-cat="all">Tudo</button>
      <button class="filter-chip" data-cat="casa">Casa</button>
      <button class="filter-chip" data-cat="beleza">Beleza</button>
      <button class="filter-chip" data-cat="moda">Moda</button>
      <button class="filter-chip" data-cat="cozinha">Cozinha</button>
      <button class="filter-chip" data-cat="presentes">Presentes</button>
      <button class="filter-chip" data-cat="living">Living</button>
    </div>
    <div class="filters" data-badge-filters>
      <button class="filter-chip active" data-badge="all">Todos</button>
      <button class="filter-chip" data-badge="NOVO">Novidades</button>
      <button class="filter-chip" data-badge="MAIS VENDIDO">Mais vendidos</button>
      <button class="filter-chip" data-badge="EDIÇÃO XII">Edição XII</button>
      <button class="filter-chip" data-badge="LIMITADO">Limitados</button>
      <button class="filter-chip" data-badge="EM ALTA">Em alta</button>
    </div>
    <div class="products-grid" data-all-grid></div>
  </div>
</section>

<footer class="footer" data-footer></footer>

<script src="assets/data.js"></script>
<script src="assets/partials.js"></script>
<script src="assets/app.js"></script>
<script>
  let activeCat = 'all', activeBadge = 'all';
  function render() {
    let list = LURDEX.products;
    if (activeCat !== 'all') list = list.filter(p => p.cat === activeCat);
    if (activeBadge !== 'all') list = list.filter(p => p.badge === activeBadge);
    document.querySelector('[data-count]').textContent = list.length + ' peça' + (list.length === 1 ? '' : 's');
    if (!list.length) {
      document.querySelector('[data-all-grid]').innerHTML =
        '<div style="grid-column: 1/-1; text-align:center; padding: var(--s-7) 0; opacity:0.7;"><p style="font-family:var(--serif); font-size:24px; font-style:italic;">Nenhuma peça encontrada com este filtro.</p></div>';
      return;
    }
    LURDEX.renderProductGrid('[data-all-grid]', list);
  }
  document.querySelectorAll('[data-cat-filters] [data-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-cat-filters] [data-cat]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCat = btn.getAttribute('data-cat');
      render();
    });
  });
  document.querySelectorAll('[data-badge-filters] [data-badge]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-badge-filters] [data-badge]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeBadge = btn.getAttribute('data-badge');
      render();
    });
  });
  render();
</script>

</body>
</html>
